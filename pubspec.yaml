name: dynamic_rcb_alerts
description: "Dynamic RCB Alerts."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Domain + Data packages (local)
  domain:
    path: packages/domain
  data:
    path: packages/data

  # State management
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.2

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Functional / models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.1
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.4.0
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_remote_config: ^5.4.3
  firebase_app_check: ^0.3.2+5

  # UI / UX
  google_fonts: ^6.2.1
  flutter_hooks: ^0.21.2
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  uuid: ^4.5.1
  logger: ^2.5.0
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^9.0.0

  # Codegen
  build_runner: ^2.5.4
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  go_router_builder: ^4.3.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Barlow / Barlow Condensed (OFL), resolved by google_fonts offline.
    - assets/google_fonts/
