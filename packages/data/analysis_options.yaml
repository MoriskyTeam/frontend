include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # freezed + json_serializable: @JsonSerializable on the factory
    # constructor is the documented pattern (see .claude/rules/dto.md).
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "**/*.module.dart"

formatter:
  trailing_commas: preserve
  page_width: 80

linter:
  rules:
    public_member_api_docs: false
