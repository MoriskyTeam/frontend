name: data
description: Data layer for Dynamic RCB Alerts. Firebase services, DTOs, mappers, repository implementations.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.3

dependencies:
  domain:
    path: ../domain

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.1
  injectable: ^2.5.0
  meta: ^1.16.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.4.0
  firebase_storage: ^12.4.5
  firebase_remote_config: ^5.4.3
  firebase_messaging: ^15.2.5

  # Local storage
  shared_preferences: ^2.5.3
  flutter:
    sdk: flutter
  geolocator: ^14.1.1

dev_dependencies:
  build_runner: ^2.5.4
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  test: ^1.25.15
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
